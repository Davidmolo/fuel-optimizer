# HTTPS vhost for https://fueloptimiser.goxxii.com/
# Separate site file. Do not edit fueloptimiser, fuel-staging, trailhead, phoenix-wms, or retention.
# Frontend: 127.0.0.1:3020  API: 127.0.0.1:5000
# Certificate: /etc/letsencrypt/live/fueloptimiser.goxxii.com/

server {
    listen 80;
    listen [::]:80;
    server_name fueloptimiser.goxxii.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fueloptimiser.goxxii.com;

    ssl_certificate /etc/letsencrypt/live/fueloptimiser.goxxii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fueloptimiser.goxxii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
