# HTTPS vhost for https://fueloptimiser.azfsllc.com/
# Do not change fuel-staging (staging.azfsllc.com:4000) or trailhead (3010/4010).
# Frontend: 127.0.0.1:3020  API: 127.0.0.1:5000
# Certificate already issued at /etc/letsencrypt/live/fueloptimiser.azfsllc.com/

upstream fueloptimiser_web {
    server 127.0.0.1:3020;
    keepalive 8;
}

upstream fueloptimiser_api {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name fueloptimiser.azfsllc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fueloptimiser.azfsllc.com;

    ssl_certificate /etc/letsencrypt/live/fueloptimiser.azfsllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fueloptimiser.azfsllc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://fueloptimiser_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://fueloptimiser_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
